# Configuración de Railway para el servicio backend.
# En el dashboard: Root Directory = backend
# Docker se usa SOLO en Railway. Desarrollo local = Linux Mint + Node nativo.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
